<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Attendance Management System</h1>
        <p>Student Attendance Dashboard</p>
    </header>

    <main class="container">

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="card present-card">
                <h3>Present Today</h3>
                <p id="presentToday">0</p>
            </div>

            <div class="card absent-card">
                <h3>Absent Today</h3>
                <p id="absentToday">0</p>
            </div>

            <div class="card">
                <h3>Attendance %</h3>
                <p id="attendancePercentage">0%</p>
            </div>

        </section>

        <!-- Add Student -->
        <section class="form-section">
            <h2>Add Student</h2>

            <form id="studentForm">

                <input
                    type="text"
                    id="studentId"
                    placeholder="Student ID"
                    required
                >

                <input
                    type="text"
                    id="studentName"
                    placeholder="Student Name"
                    required
                >

                <button type="submit">Add Student</button>

            </form>
        </section>

        <!-- Attendance -->
        <section class="attendance-section">

            <div class="section-header">
                <h2>Mark Attendance</h2>

                <input
                    type="date"
                    id="attendanceDate"
                >
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th>Status</th>
                            <th>Attendance %</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                    </tbody>

                </table>

            </div>

        </section>

        <!-- Attendance History -->
        <section class="history-section">

            <h2>Attendance History</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="historyTable">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Attendance Management System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
